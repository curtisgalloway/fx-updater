[project]
name = "fx-updater"
version = "0.1.0"
description = "Keep a Fuchsia checkout updated and built on a schedule, with guardrails"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Curtis Galloway" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fx-updater = "fx_updater.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = ["fx_updater"]

[tool.setuptools.package-data]
fx_updater = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
